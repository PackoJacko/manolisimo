<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manolisimo</title>
    <meta
      name="description"
      content="Archivo vivo de ideas absurdas para convertir ocurrencias en ilustraciones y productos."
    />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./android-chrome-512x512.png" />
    <style>
      :root {
        --background: #f7f4ee;
        --foreground: #20201c;
        --ink: #20201c;
        --paper: #fffdf8;
        --paper-strong: #fff8e7;
        --line: #ded5c5;
        --muted: #776f63;
        --green: #2f6d5a;
        --red: #b54842;
        --yellow: #f0b64a;
        --blue: #456a9b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          linear-gradient(90deg, rgba(32, 32, 28, 0.035) 1px, transparent 1px),
          linear-gradient(rgba(32, 32, 28, 0.035) 1px, transparent 1px),
          var(--background);
        background-size: 28px 28px;
        color: var(--foreground);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app-shell {
        margin: 0 auto;
        max-width: 1220px;
        min-height: 100vh;
        padding: 28px;
      }

      .topbar {
        align-items: center;
        display: flex;
        gap: 20px;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .brand-lockup {
        align-items: center;
        display: flex;
        gap: 18px;
      }

      .brand-lockup img {
        aspect-ratio: 1;
        background: #f6c119;
        border: 2px solid var(--ink);
        box-shadow: 5px 5px 0 var(--ink);
        flex: 0 0 86px;
        height: 86px;
        object-fit: cover;
        width: 86px;
      }

      .eyebrow {
        color: var(--green);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0;
        margin: 0 0 7px;
        text-transform: uppercase;
      }

      h1,
      h2 {
        letter-spacing: 0;
        line-height: 1;
        margin: 0;
      }

      h1 {
        font-size: clamp(2.6rem, 7vw, 6.5rem);
        font-weight: 950;
      }

      h2 {
        font-size: clamp(1.45rem, 3vw, 2.35rem);
        font-weight: 900;
      }

      .sync-status {
        align-items: center;
        color: var(--green);
        display: flex;
        font-size: 0.78rem;
        font-weight: 800;
        gap: 7px;
        margin: 12px 0 0;
      }

      .sync-status span {
        background: currentColor;
        border-radius: 50%;
        height: 8px;
        width: 8px;
      }

      .sync-status.error {
        color: var(--red);
      }

      .counter {
        align-items: center;
        aspect-ratio: 1;
        background: var(--ink);
        border: 2px solid var(--ink);
        color: #fffaf0;
        display: grid;
        flex: 0 0 88px;
        justify-items: center;
        padding: 14px;
        text-align: center;
      }

      .counter strong {
        font-size: 2rem;
        line-height: 0.9;
      }

      .counter span {
        color: #e8dfce;
        font-size: 0.8rem;
      }

      .capture-panel {
        background: var(--paper);
        border: 2px solid var(--ink);
        box-shadow: 7px 7px 0 var(--ink);
        display: grid;
        gap: 18px;
        grid-template-columns:
          minmax(180px, 0.75fr) minmax(280px, 1.7fr)
          minmax(230px, 0.8fr);
        margin-bottom: 26px;
        padding: 20px;
      }

      .style-panel {
        align-items: center;
        background: #fffdf8;
        border: 2px solid var(--ink);
        display: grid;
        gap: 18px;
        grid-template-columns: minmax(220px, 0.8fr) minmax(300px, 1.4fr);
        margin-bottom: 18px;
        padding: 18px 20px;
      }

      .style-panel h2 {
        font-size: clamp(1.25rem, 2.4vw, 1.95rem);
        line-height: 1.08;
      }

      .style-panel ul {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .style-panel li {
        border-left: 5px solid var(--yellow);
        color: var(--muted);
        font-size: 0.92rem;
        font-weight: 750;
        line-height: 1.3;
        padding-left: 10px;
      }

      textarea {
        background: #fffaf0;
        border: 2px solid var(--line);
        color: var(--ink);
        min-height: 118px;
        padding: 14px;
        resize: vertical;
        width: 100%;
      }

      .idea-input {
        display: grid;
        gap: 9px;
      }

      .dictation-row {
        align-items: center;
        display: flex;
        gap: 10px;
      }

      .dictation-row > span {
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.25;
      }

      .dictation-button {
        align-items: center;
        background: var(--green);
        border: 2px solid var(--ink);
        color: white;
        display: inline-flex;
        flex: 0 0 auto;
        font-size: 0.86rem;
        font-weight: 900;
        gap: 7px;
        min-height: 42px;
        padding: 0 13px;
      }

      .dictation-button svg {
        fill: currentColor;
        height: 19px;
        width: 19px;
      }

      .dictation-button.listening {
        animation: recording-pulse 1.3s ease-in-out infinite;
        background: var(--red);
      }

      .dictation-button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .speech-error {
        color: var(--red);
        font-size: 0.82rem;
        font-weight: 750;
        margin: 0;
      }

      @keyframes recording-pulse {
        50% {
          box-shadow: 0 0 0 5px rgba(181, 72, 66, 0.2);
        }
      }

      textarea:focus,
      input:focus,
      select:focus,
      button:focus-visible {
        outline: 3px solid rgba(69, 106, 155, 0.35);
        outline-offset: 2px;
      }

      .capture-actions {
        display: grid;
        gap: 12px;
      }

      label {
        color: var(--muted);
        display: grid;
        font-size: 0.82rem;
        font-weight: 800;
        gap: 7px;
        text-transform: uppercase;
      }

      input,
      select {
        background: #fffaf0;
        border: 2px solid var(--line);
        color: var(--ink);
        min-height: 44px;
        padding: 0 12px;
      }

      .capture-actions button,
      .secondary-action {
        align-self: end;
        background: var(--red);
        border: 2px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        color: white;
        font-weight: 900;
        min-height: 48px;
        padding: 0 16px;
      }

      .secondary-action {
        background: var(--blue);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }

      .status-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
      }

      .status-tabs button {
        background: rgba(255, 253, 248, 0.78);
        border: 2px solid var(--line);
        color: var(--muted);
        font-weight: 850;
        min-height: 42px;
        padding: 0 14px;
      }

      .status-tabs button.active {
        background: var(--yellow);
        border-color: var(--ink);
        color: var(--ink);
      }

      .workspace {
        align-items: start;
        display: grid;
        gap: 22px;
        grid-template-columns: minmax(270px, 0.86fr) minmax(0, 1.5fr);
      }

      .idea-list {
        display: grid;
        gap: 12px;
      }

      .idea-row {
        align-items: center;
        background: rgba(255, 253, 248, 0.82);
        border: 2px solid var(--line);
        color: var(--ink);
        display: flex;
        gap: 14px;
        justify-content: space-between;
        min-height: 84px;
        padding: 14px;
        text-align: left;
        width: 100%;
      }

      .idea-row.selected {
        background: var(--paper-strong);
        border-color: var(--ink);
        box-shadow: 5px 5px 0 var(--ink);
      }

      .idea-row span {
        display: grid;
        gap: 5px;
        min-width: 0;
      }

      .idea-row strong {
        font-size: 1.02rem;
        line-height: 1.1;
      }

      .idea-row small {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .idea-row em {
        color: var(--blue);
        flex: 0 0 auto;
        font-size: 0.78rem;
        font-style: normal;
        font-weight: 900;
      }

      .idea-card,
      .empty-state {
        background: var(--paper);
        border: 2px solid var(--ink);
        box-shadow: 7px 7px 0 var(--ink);
        min-height: 560px;
        padding: clamp(18px, 3vw, 30px);
      }

      .idea-card-header {
        align-items: start;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 24px;
      }

      .idea-tools {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-end;
      }

      .idea-tools select,
      .idea-card-header select {
        min-width: 148px;
      }

      .tool-button {
        background: #fffaf0;
        border: 2px solid var(--ink);
        color: var(--ink);
        font-weight: 900;
        min-height: 44px;
        padding: 0 13px;
      }

      .tool-button.primary {
        background: var(--yellow);
      }

      .idea-fields {
        display: grid;
        gap: 14px;
        margin: 0;
      }

      .idea-fields div {
        border-top: 2px solid var(--line);
        display: grid;
        gap: 8px;
        padding-top: 14px;
      }

      dt {
        color: var(--green);
        font-size: 0.78rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      dd {
        font-size: 1rem;
        line-height: 1.45;
        margin: 0;
      }

      .edit-textarea {
        min-height: 92px;
      }

      .edit-input,
      .edit-textarea {
        background: #fffaf0;
        border-color: var(--ink);
        width: 100%;
      }

      .product-text {
        background: var(--ink);
        color: #fffaf0;
        display: inline-block;
        font-size: clamp(1.45rem, 4vw, 2.8rem);
        font-weight: 950;
        justify-self: start;
        line-height: 1;
        padding: 12px 14px;
      }

      .sketches-section {
        border-top: 2px solid var(--ink);
        margin-top: 24px;
        padding-top: 18px;
      }

      .sketches-heading {
        align-items: center;
        display: flex;
        gap: 16px;
        justify-content: space-between;
      }

      .sketches-heading h3 {
        font-size: 1.35rem;
        line-height: 1;
        margin: 0;
      }

      .sketch-upload {
        background: var(--green);
        border: 2px solid var(--ink);
        color: white;
        cursor: pointer;
        display: inline-grid;
        font-size: 0.82rem;
        font-weight: 900;
        min-height: 42px;
        padding: 0 13px;
        place-items: center;
        text-transform: none;
      }

      .sketch-upload input {
        height: 1px;
        opacity: 0;
        overflow: hidden;
        padding: 0;
        position: absolute;
        width: 1px;
      }

      .sketch-upload.disabled {
        cursor: wait;
        opacity: 0.55;
      }

      .sketch-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        margin-top: 16px;
      }

      .sketch-grid a {
        background: #fffaf0;
        border: 2px solid var(--line);
        color: var(--ink);
        display: grid;
        min-width: 0;
        text-decoration: none;
      }

      .sketch-grid a:hover,
      .sketch-grid a:focus-visible {
        border-color: var(--ink);
      }

      .sketch-grid img {
        aspect-ratio: 4 / 3;
        background: var(--paper-strong);
        display: block;
        object-fit: cover;
        width: 100%;
      }

      .sketch-grid span {
        font-size: 0.75rem;
        font-weight: 800;
        overflow: hidden;
        padding: 8px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sketch-empty,
      .upload-message {
        color: var(--muted);
        font-size: 0.8rem;
        margin: 12px 0 0;
      }

      .upload-message {
        font-weight: 750;
      }

      .upload-message.error {
        color: var(--red);
      }

      .idea-footer {
        border-top: 2px solid var(--ink);
        color: var(--muted);
        display: flex;
        font-size: 0.9rem;
        font-weight: 800;
        justify-content: space-between;
        margin-top: 24px;
        padding-top: 14px;
      }

      .empty-state {
        display: grid;
        place-content: center;
        text-align: center;
      }

      .empty-state p {
        color: var(--muted);
      }

      .github-note {
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.45;
        margin-top: 22px;
      }

      @media (max-width: 860px) {
        .app-shell {
          padding: 18px;
        }

        .capture-panel,
        .style-panel,
        .workspace {
          grid-template-columns: 1fr;
        }

        .topbar {
          align-items: end;
        }

        .counter {
          flex-basis: 72px;
        }
      }

      @media (max-width: 560px) {
        .topbar,
        .idea-card-header,
        .idea-tools,
        .idea-footer {
          align-items: stretch;
          flex-direction: column;
        }

        .counter {
          align-items: center;
          aspect-ratio: auto;
          display: flex;
          flex-basis: auto;
          gap: 8px;
          justify-content: center;
          min-height: 52px;
          width: 100%;
        }

        .idea-row {
          align-items: start;
          flex-direction: column;
        }

        .brand-lockup {
          align-items: flex-start;
        }

        .brand-lockup img {
          flex-basis: 64px;
          height: 64px;
          width: 64px;
        }

        .style-panel ul {
          grid-template-columns: 1fr;
        }

        .sketches-heading {
          align-items: stretch;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar" aria-label="Cabecera Manolisimo">
        <div class="brand-lockup">
          <img src="./assets/benitez-logo.jpg" alt="Logo de Benitez+" />
          <div>
            <p class="eyebrow">Archivo vivo de tonterias ilustrables</p>
            <h1>Manolisimo</h1>
          </div>
        </div>
        <div class="counter" aria-label="Ideas guardadas">
          <strong id="idea-count">0</strong>
          <span>ideas</span>
        </div>
      </header>

      <section class="capture-panel" aria-labelledby="new-idea-title">
        <div>
          <p class="eyebrow">Entrada rapida</p>
          <h2 id="new-idea-title">Nueva gilipollez</h2>
          <p class="sync-status" id="sync-status" aria-live="polite">
            <span aria-hidden="true"></span>
            <strong>Conectando...</strong>
          </p>
        </div>
        <div class="idea-input">
          <textarea
            id="raw-idea"
            aria-label="Escribe o dicta una idea en bruto"
            placeholder="Ej: un notario que certifica si una croqueta esta demasiado caliente..."
          ></textarea>
          <div class="dictation-row">
            <button
              aria-label="Dictar idea con el microfono"
              aria-pressed="false"
              class="dictation-button"
              id="dictation-button"
              type="button"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Zm7-4a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H8a1 1 0 1 0 0 2h8a1 1 0 1 0 0-2h-3v-2.08A7 7 0 0 0 19 11Z" />
              </svg>
              <span>Hablar</span>
            </button>
            <span id="dictation-status" aria-live="polite">Tambien puedes dictar la idea</span>
          </div>
          <p class="speech-error" id="speech-error" role="alert" hidden></p>
        </div>
        <div class="capture-actions">
          <label>
            Culpable
            <input id="author" value="Packo" aria-label="Autor de la idea" />
          </label>
          <button id="add-idea" type="button">Ordenar idea</button>
        </div>
      </section>

      <section class="style-panel" aria-labelledby="style-panel-title">
        <div>
          <p class="eyebrow">ADN Benitez+</p>
          <h2 id="style-panel-title">Humor de refran reventado y personaje con gesto</h2>
        </div>
        <ul id="style-traits"></ul>
      </section>

      <nav class="status-tabs" aria-label="Filtrar ideas por estado" id="filters"></nav>

      <section class="workspace">
        <div class="idea-list" aria-label="Lista de ideas" id="idea-list"></div>
        <article id="idea-detail"></article>
      </section>
    </main>

    <script>
      const statuses = ["Pendiente", "Favorita", "Dibujando", "Hecha"];
      const filters = ["Todas", ...statuses];
      const storageKey = "manolisimo-ideas";
      const databaseUrl = "https://vlajqijjekgmwwajugfl.supabase.co/rest/v1/ideas";
      const sketchesDatabaseUrl =
        "https://vlajqijjekgmwwajugfl.supabase.co/rest/v1/idea_sketches";
      const sketchesStorageUrl =
        "https://vlajqijjekgmwwajugfl.supabase.co/storage/v1/object/idea-sketches";
      const sketchesPublicUrl =
        "https://vlajqijjekgmwwajugfl.supabase.co/storage/v1/object/public/idea-sketches";
      const databaseKey = "sb_publishable_rLOoqZ7G1wwLzG32tTZhtw_0mbOJWbL";
      const maxSketchSize = 5 * 1024 * 1024;
      const allowedSketchTypes = new Set([
        "image/jpeg",
        "image/png",
        "image/webp",
        "image/gif",
        "image/heic",
        "image/heif",
      ]);
      const databaseHeaders = {
        apikey: databaseKey,
        "Content-Type": "application/json",
      };

      const examples = [
        {
          id: 1,
          title: "San USB Bendito",
          raw: "Un santo patron de los cargadores rotos.",
          summary:
            "Un santo cotidiano que protege cables que solo cargan si los colocas en un angulo imposible.",
          why:
            "Mezcla epica religiosa con una miseria tecnologica universal y ridicula.",
          illustration:
            "Un santo con halo, tunica y un cable pelado entre las manos, bendiciendo un movil al 2%.",
          productText: "Reza para que cargue",
          category: "Tecnologia cotidiana",
          status: "Favorita",
          author: "Packo",
          createdAt: "2026-08-28",
        },
        {
          id: 2,
          title: "Pulpo Autonomo",
          raw: "Un pulpo autonomo que factura en tinta.",
          summary:
            "Un pulpo freelance agotado que usa su propia tinta para emitir facturas, presupuestos y quejas.",
          why:
            "Convierte la vida laboral en una imagen literal absurda y muy dibujable.",
          illustration:
            "Pulpo con ocho brazos en una mesa, portatil, cafe, impresora y papeles manchados de tinta.",
          productText: "Facturo en tinta",
          category: "Trabajo absurdo",
          status: "Pendiente",
          author: "Manolo",
          createdAt: "2026-08-28",
        },
        {
          id: 3,
          title: "Gazpacho Con Manual",
          raw: "Un señor enfadado porque el gazpacho no tiene instrucciones.",
          summary:
            "Alguien intenta montar un gazpacho como si fuese un mueble complicado.",
          why:
            "La gracia esta en tratar una comida liquida como un objeto tecnico imposible.",
          illustration:
            "Mesa con tomates, pepino, una llave Allen, un vaso confundido y un manual abierto.",
          productText: "Agitar antes de tener una crisis",
          category: "Comida dramatica",
          status: "Dibujando",
          author: "Los dos",
          createdAt: "2026-08-28",
        },
      ];

      const benitezTraits = [
        "Linea negra gruesa y nerviosa sobre fondo limpio",
        "Personajes de nariz protagonista, boca grande y gesto teatral",
        "Colores planos con mostaza, naranja, negro, gris y algun golpe vivo",
        "Humor de refran espanol torcido, literalidad absurda y costumbrismo bruto",
      ];

      const productPhrases = [
        "Muchas gracias",
        "Me hago el sordo",
        "Igual se cae",
        "Que viva esto",
        "No era necesario",
        "Ojo que viene",
        "A mi manera",
      ];

      const editableFields = [
        ["raw", "Frase original", true],
        ["summary", "Version ordenada", true],
        ["why", "Por que hace gracia", true],
        ["illustration", "Posible ilustracion", true],
        ["productText", "Texto para producto", false],
      ];

      let ideas = readIdeas();
      let sketches = [];
      let activeStatus = "Todas";
      let activeId = ideas[0]?.id;
      let editingId = null;
      let editDraft = null;
      let isUploading = false;
      let uploadMessage = "";
      let uploadError = false;

      function readIdeas() {
        const saved = window.localStorage.getItem(storageKey);
        return saved ? JSON.parse(saved) : examples;
      }

      function saveIdeas() {
        window.localStorage.setItem(storageKey, JSON.stringify(ideas));
      }

      function toDatabaseIdea(idea) {
        return {
          id: idea.id,
          title: idea.title,
          raw: idea.raw,
          summary: idea.summary,
          why: idea.why,
          illustration: idea.illustration,
          product_text: idea.productText,
          category: idea.category,
          status: idea.status,
          author: idea.author,
          created_at: idea.createdAt,
        };
      }

      function fromDatabaseIdea(idea) {
        return {
          id: Number(idea.id),
          title: idea.title,
          raw: idea.raw,
          summary: idea.summary,
          why: idea.why,
          illustration: idea.illustration,
          productText: idea.product_text,
          category: idea.category,
          status: idea.status,
          author: idea.author,
          createdAt: idea.created_at,
        };
      }

      function setSyncStatus(message, isError = false) {
        const syncNode = document.querySelector("#sync-status");
        syncNode.classList.toggle("error", isError);
        syncNode.querySelector("strong").textContent = message;
      }

      async function fetchSharedIdeas() {
        const fields =
          "id,title,raw,summary,why,illustration,product_text,category,status,author,created_at";
        const response = await fetch(
          `${databaseUrl}?select=${fields}&order=created_at.desc,id.desc`,
          { headers: databaseHeaders },
        );

        if (!response.ok) {
          throw new Error("No se han podido cargar las ideas compartidas.");
        }

        const sharedIdeas = await response.json();
        return sharedIdeas.map(fromDatabaseIdea);
      }

      function sketchPublicUrl(storagePath) {
        return `${sketchesPublicUrl}/${storagePath
          .split("/")
          .map(encodeURIComponent)
          .join("/")}`;
      }

      function fromDatabaseSketch(sketch) {
        return {
          id: Number(sketch.id),
          ideaId: Number(sketch.idea_id),
          storagePath: sketch.storage_path,
          fileName: sketch.file_name,
          mimeType: sketch.mime_type,
          sizeBytes: Number(sketch.size_bytes),
          createdAt: sketch.created_at,
          publicUrl: sketchPublicUrl(sketch.storage_path),
        };
      }

      async function fetchSharedSketches() {
        const fields =
          "id,idea_id,storage_path,file_name,mime_type,size_bytes,created_at";
        const response = await fetch(
          `${sketchesDatabaseUrl}?select=${fields}&order=created_at.desc,id.desc`,
          { headers: databaseHeaders },
        );

        if (!response.ok) {
          throw new Error("No se han podido cargar los bocetos adjuntos.");
        }

        return (await response.json()).map(fromDatabaseSketch);
      }

      function safeFileName(name) {
        const extension = name.includes(".")
          ? `.${name.split(".").pop().toLowerCase()}`
          : "";
        const base =
          name
            .replace(/\.[^.]+$/, "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-zA-Z0-9_-]+/g, "-")
            .replace(/^-+|-+$/g, "")
            .slice(0, 60) || "boceto";

        return `${base}${extension}`;
      }

      async function uploadSharedSketch(ideaId, file) {
        const storagePath = `${ideaId}/${crypto.randomUUID()}-${safeFileName(file.name)}`;
        const encodedPath = storagePath.split("/").map(encodeURIComponent).join("/");
        const uploadResponse = await fetch(`${sketchesStorageUrl}/${encodedPath}`, {
          method: "POST",
          headers: {
            apikey: databaseKey,
            "Content-Type": file.type,
            "x-upsert": "false",
          },
          body: file,
        });

        if (!uploadResponse.ok) {
          throw new Error(`No se ha podido subir ${file.name}.`);
        }

        const metadataResponse = await fetch(sketchesDatabaseUrl, {
          method: "POST",
          headers: { ...databaseHeaders, Prefer: "return=representation" },
          body: JSON.stringify({
            idea_id: ideaId,
            storage_path: storagePath,
            file_name: file.name,
            mime_type: file.type,
            size_bytes: file.size,
          }),
        });

        if (!metadataResponse.ok) {
          throw new Error(
            `El archivo ${file.name} se ha subido, pero no se ha podido adjuntar a la ficha.`,
          );
        }

        const [savedSketch] = await metadataResponse.json();
        return fromDatabaseSketch(savedSketch);
      }

      async function importLocalIdeas(localIdeas) {
        if (!localIdeas.length) return;

        const response = await fetch(`${databaseUrl}?on_conflict=id`, {
          method: "POST",
          headers: {
            ...databaseHeaders,
            Prefer: "resolution=ignore-duplicates,return=minimal",
          },
          body: JSON.stringify(localIdeas.map(toDatabaseIdea)),
        });

        if (!response.ok) {
          throw new Error("No se han podido importar las ideas de este dispositivo.");
        }
      }

      async function saveSharedIdea(idea) {
        const response = await fetch(databaseUrl, {
          method: "POST",
          headers: { ...databaseHeaders, Prefer: "return=minimal" },
          body: JSON.stringify(toDatabaseIdea(idea)),
        });

        if (!response.ok) {
          throw new Error("Guardado localmente; pendiente de sincronizar.");
        }
      }

      async function saveSharedStatus(id, status) {
        const response = await fetch(`${databaseUrl}?id=eq.${id}`, {
          method: "PATCH",
          headers: { ...databaseHeaders, Prefer: "return=minimal" },
          body: JSON.stringify({ status }),
        });

        if (!response.ok) {
          throw new Error("Estado guardado localmente; pendiente de sincronizar.");
        }
      }

      async function saveSharedIdeaDetails(id, fields) {
        const response = await fetch(`${databaseUrl}?id=eq.${id}`, {
          method: "PATCH",
          headers: { ...databaseHeaders, Prefer: "return=minimal" },
          body: JSON.stringify({
            raw: fields.raw,
            summary: fields.summary,
            why: fields.why,
            illustration: fields.illustration,
            product_text: fields.productText,
          }),
        });

        if (!response.ok) {
          throw new Error("Cambios guardados localmente; pendiente de sincronizar.");
        }
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function titleCase(value) {
        return value
          .trim()
          .replace(/[¿?¡!.,;:]+$/g, "")
          .split(/\s+/)
          .slice(0, 4)
          .map((word) => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
          .join(" ");
      }

      function pickCategory(text) {
        const lower = text.toLowerCase();

        if (/refran|dicho|mal anda|caballo regalado|palabras necias|cuervos/.test(lower)) {
          return "Refran torcido";
        }

        if (/jefe|curro|trabajo|oficina|factura|reunion|excel|autonomo/.test(lower)) {
          return "Trabajo absurdo";
        }

        if (/colega|amigo|equipo|pena|fiesta|futbol/.test(lower)) {
          return "Musica y colegas";
        }

        if (/suegra|familia|cunado|vecino/.test(lower)) {
          return "Familia peligrosa";
        }

        if (/cable|movil|usb|ordenador|wifi|app|email|correo/.test(lower)) {
          return "Tecnologia cotidiana";
        }

        if (/gazpacho|taza|cafe|pan|tomate|croqueta|bocata|comida/.test(lower)) {
          return "Comida dramatica";
        }

        if (/señor|senor|vecino|cuñado|cunado/.test(lower)) {
          return "Señores raros";
        }

        const categoryHints = [
          "Tecnologia cotidiana",
          "Comida dramatica",
          "Trabajo absurdo",
          "Refran torcido",
          "Musica y colegas",
          "Familia peligrosa",
          "Criaturas administrativas",
          "Señores raros",
          "Objetos con ansiedad",
        ];

        return categoryHints[Math.floor(Math.random() * categoryHints.length)];
      }

      function makeBenitezProductText(title, raw) {
        const lower = raw.toLowerCase();

        if (lower.includes("...")) {
          return (
            raw
              .split("...")
              .map((part) => part.trim())
              .filter(Boolean)
              .slice(-1)[0]
              ?.replace(/[.]+$/g, "") || title
          );
        }

        if (/[¿?¡!]/.test(raw) && raw.length <= 34) {
          return raw.replace(/[.]+$/g, "");
        }

        if (title.length <= 22) {
          return title;
        }

        return productPhrases[Math.floor(Math.random() * productPhrases.length)];
      }

      function makeIdea(raw, author) {
        const trimmed = raw.trim();
        const category = pickCategory(trimmed);
        const title = titleCase(trimmed) || "Idea Sin Nombre";
        const subject = trimmed.replace(/[.]+$/g, "");
        const isSaying =
          /refran|dicho|\.{3}|mal anda|caballo regalado|palabras necias|cuervos/.test(
            trimmed.toLowerCase(),
          );

        return {
          id: Date.now(),
          title,
          raw: trimmed,
          summary: isSaying
            ? "La idea funciona como un refran conocido llevado hacia una salida mas tonta, literal y de camiseta."
            : `La idea gira alrededor de ${subject}, convertida en una escena cotidiana con una exageracion clara.`,
          why:
            "Encaja con Benitez+ porque trata una frase normal como si fuese una situacion fisica real: poco decorado, gesto grande, remate seco y absurdo reconocible.",
          illustration:
            "Dibujarlo como una vineta limpia: personaje central de nariz marcada y boca expresiva, linea negra gruesa, sombra gris suave, dos o tres detalles de contexto y un color protagonista tipo mostaza, naranja, verde o rojo.",
          productText: makeBenitezProductText(title, trimmed),
          category,
          status: "Pendiente",
          author: author.trim() || "Sin culpable",
          createdAt: new Date().toISOString().slice(0, 10),
        };
      }

      function renderFilters() {
        const filtersNode = document.querySelector("#filters");

          .map(
            (filter) =>
              `<button class="${activeStatus === filter ? "active" : ""}" type="button" data-filter="${filter}">${filter}</button>`,
          )
          .join("");

        filtersNode.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => {
            activeStatus = button.dataset.filter;
            render();
          });
        });
      }

      function renderList() {
        const visible =
          activeStatus === "Todas"
            ? ideas
            : ideas.filter((idea) => idea.status === activeStatus);
        const listNode = document.querySelector("#idea-list");

        if (!visible.length) {
          listNode.innerHTML = "";
          return;
        }

        listNode.innerHTML = visible
          .map(
            (idea) => `
              <button class="idea-row ${activeId === idea.id ? "selected" : ""}" type="button" data-id="${idea.id}">
                <span>
                  <strong>${escapeHtml(idea.title)}</strong>
                  <small>${escapeHtml(idea.category)}</small>
                </span>
                <em>${escapeHtml(idea.status)}</em>
              </button>
            `,
          )
          .join("");

        listNode.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => {
            activeId = Number(button.dataset.id);
            render();
          });
        });
      }

          activeStatus === "Todas"

        const activeSketches = sketches.filter(
          (sketch) => sketch.ideaId === activeIdea.id,
        );
        detailNode.className = "idea-card";
        detailNode.innerHTML = `

          </div>

          <dl class="idea-fields">

                return `
                  <div>
                    <dt>${label}</dt>

              .join("")}
          </dl>

          <section class="sketches-section" aria-labelledby="sketches-title">
            <div class="sketches-heading">
              <div>
                <p class="eyebrow">Material visual</p>
                <h3 id="sketches-title">Bocetos adjuntos</h3>
              </div>
              <label class="sketch-upload ${isUploading ? "disabled" : ""}">
                <input
                  accept="image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif"
                  id="sketch-input"
                  ${isUploading ? "disabled" : ""}
                  multiple
                  type="file"
                />
                ${isUploading ? "Subiendo..." : "+ Adjuntar bocetos"}
              </label>
            </div>

            ${
              activeSketches.length
                ? `<div class="sketch-grid">
                    ${activeSketches
                      .map(
                        (sketch) => `
                          <a
                            aria-label="Abrir boceto ${escapeHtml(sketch.fileName)}"
                            href="${escapeHtml(sketch.publicUrl)}"
                            rel="noreferrer"
                            target="_blank"
                            title="${escapeHtml(sketch.fileName)}"
                          >
                            <img alt="${escapeHtml(sketch.fileName)}" loading="lazy" src="${escapeHtml(sketch.publicUrl)}" />
                            <span>${escapeHtml(sketch.fileName)}</span>
                          </a>
                        `,
                      )
                      .join("")}
                  </div>`
                : '<p class="sketch-empty">Todavía no hay bocetos en esta ficha.</p>'
            }

            <p class="upload-message ${uploadError ? "error" : ""}" aria-live="polite">
              ${
                escapeHtml(uploadMessage) ||
                "JPG, PNG, WebP, GIF o foto del móvil · máximo 5 MB por archivo"
              }
            </p>
          </section>

          <p class="github-note">
            Las ideas se sincronizan entre todos los navegadores que abran Manolisimo.
          </p>

          <footer class="idea-footer">
            <span>${escapeHtml(activeIdea.author)}</span>
            <span>${escapeHtml(activeIdea.createdAt)}</span>
          </footer>
        `;

        document.querySelector("#status-select").addEventListener("change", async (event) => {
          activeIdea.status = event.target.value;
          saveIdeas();
          render();
          setSyncStatus("Guardando...");

          try {
            await saveSharedStatus(activeIdea.id, activeIdea.status);
            setSyncStatus("Sincronizado");
          } catch (error) {
            setSyncStatus(error.message, true);
          }
        });

        document.querySelector("#pdf-button").addEventListener("click", () => {
          exportIdeaPdf(activeIdea);
        });

        const editButton = document.querySelector("#edit-button");
        if (editButton) {
          editButton.addEventListener("click", () => {
            editingId = activeIdea.id;
            editDraft = makeDraft(activeIdea);
            render();
          });
        }

        const cancelButton = document.querySelector("#cancel-edit-button");
        if (cancelButton) {
          cancelButton.addEventListener("click", () => {
            editingId = null;
            editDraft = null;
            render();
          });
        }

        document.querySelectorAll("[data-edit-field]").forEach((field) => {
          field.addEventListener("input", (event) => {
            editDraft[event.target.dataset.editField] = event.target.value;
          });
        });

        const saveButton = document.querySelector("#save-edit-button");
        if (saveButton) {
          saveButton.addEventListener("click", async () => {
            const updatedIdea = { ...activeIdea, ...editDraft };
            ideas = ideas.map((idea) => (idea.id === activeIdea.id ? updatedIdea : idea));
            editingId = null;
            editDraft = null;
            saveIdeas();
            render();
            setSyncStatus("Guardando...");

            try {
              await saveSharedIdeaDetails(activeIdea.id, makeDraft(updatedIdea));
              setSyncStatus("Sincronizado");
            } catch (error) {
              setSyncStatus(error.message, true);
            }
          });
        }

        document.querySelector("#sketch-input").addEventListener("change", async (event) => {
          const selectedFiles = Array.from(event.target.files || []).slice(0, 5);
          if (!selectedFiles.length) return;

          const invalidFile = selectedFiles.find(
            (file) =>
              !allowedSketchTypes.has(file.type) ||
              file.size <= 0 ||
              file.size > maxSketchSize,
          );

          if (invalidFile) {
            uploadMessage = `${invalidFile.name} no es una imagen compatible o supera el límite de 5 MB.`;
            uploadError = true;
            renderDetail();
            return;
          }

          isUploading = true;
          uploadError = false;
          renderDetail();

          try {
            for (let index = 0; index < selectedFiles.length; index += 1) {
              uploadMessage = `Subiendo ${index + 1} de ${selectedFiles.length}...`;
              renderDetail();
              const savedSketch = await uploadSharedSketch(
                activeIdea.id,
                selectedFiles[index],
              );
              sketches = [savedSketch, ...sketches];
            }

            uploadMessage =
              selectedFiles.length === 1
                ? "Boceto adjuntado"
                : `${selectedFiles.length} bocetos adjuntados`;
          } catch (error) {
            uploadMessage = error.message || "No se han podido adjuntar los bocetos.";
            uploadError = true;
          } finally {
            isUploading = false;
            renderDetail();
          }
        });
      }

      function render() {
        document.querySelector("#idea-count").textContent = ideas.length;
        document.querySelector("#style-traits").innerHTML = benitezTraits
          .map((trait) => `<li>${escapeHtml(trait)}</li>`)
          .join("");
        renderFilters();
        renderList();
        renderDetail();
      }

      const DictationRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;
      const dictationButton = document.querySelector("#dictation-button");
      const dictationLabel = dictationButton.querySelector("span");
      const dictationStatus = document.querySelector("#dictation-status");
      const speechError = document.querySelector("#speech-error");
      let recognition = null;
      let speechBase = "";

      if (!DictationRecognition) {
        dictationButton.disabled = true;
        dictationStatus.textContent = "El dictado no esta disponible en este navegador";
      }

      function finishDictation() {
        recognition = null;
        dictationButton.classList.remove("listening");
        dictationButton.setAttribute("aria-pressed", "false");
        dictationButton.setAttribute("aria-label", "Dictar idea con el microfono");
        dictationLabel.textContent = "Hablar";
        dictationStatus.textContent = "Tambien puedes dictar la idea";
      }

      dictationButton.addEventListener("click", () => {
        if (recognition) {
          recognition.stop();
          return;
        }

        const rawIdeaNode = document.querySelector("#raw-idea");
        recognition = new DictationRecognition();
        speechBase = rawIdeaNode.value.trim();
        speechBase = speechBase ? `${speechBase} ` : "";
        recognition.lang = "es-ES";
        recognition.continuous = true;
        recognition.interimResults = true;
        speechError.hidden = true;
        dictationButton.classList.add("listening");
        dictationButton.setAttribute("aria-pressed", "true");
        dictationButton.setAttribute("aria-label", "Detener grabacion");
        dictationLabel.textContent = "Detener";
        dictationStatus.textContent = "Escuchando... habla con normalidad";

        recognition.onresult = (event) => {
          let transcript = "";

          for (let index = 0; index < event.results.length; index += 1) {
            transcript += event.results[index][0].transcript;
          }

          rawIdeaNode.value = `${speechBase}${transcript}`;
        };

        recognition.onerror = (event) => {
          speechError.textContent =
            event.error === "not-allowed"
              ? "Necesito permiso para usar el microfono."
              : event.error === "no-speech"
                ? "No he oido nada. Pulsa el microfono para intentarlo de nuevo."
                : "No se ha podido transcribir. Intentalo otra vez.";
          speechError.hidden = false;
          finishDictation();
        };

        recognition.onend = finishDictation;

        try {
          recognition.start();
        } catch {
          speechError.textContent = "No se ha podido iniciar el microfono. Intentalo otra vez.";
          speechError.hidden = false;
          finishDictation();
        }
      });

      document.querySelector("#add-idea").addEventListener("click", async () => {
        const rawIdeaNode = document.querySelector("#raw-idea");
        const authorNode = document.querySelector("#author");

        if (!rawIdeaNode.value.trim()) {
          rawIdeaNode.focus();
          return;
        }

        const idea = makeIdea(rawIdeaNode.value, authorNode.value);
        ideas = [idea, ...ideas];
        activeId = idea.id;
        activeStatus = "Todas";
        rawIdeaNode.value = "";
        saveIdeas();
        render();
        setSyncStatus("Guardando...");

        try {
          await saveSharedIdea(idea);
          setSyncStatus("Sincronizado");
        } catch (error) {
          setSyncStatus(error.message, true);
        }
      });

      async function startSync() {
        const localIdeas = [...ideas];

        try {
          await importLocalIdeas(localIdeas);
          [ideas, sketches] = await Promise.all([
            fetchSharedIdeas(),
            fetchSharedSketches(),
          ]);
          activeId = ideas.find((idea) => idea.id === activeId)?.id || ideas[0]?.id;
          saveIdeas();
          render();
          setSyncStatus("Sincronizado");
        } catch {
          setSyncStatus("Sin conexion · guardado local", true);
        }
      }

      window.setInterval(async () => {
        try {
          [ideas, sketches] = await Promise.all([
            fetchSharedIdeas(),
            fetchSharedSketches(),
          ]);
          activeId = ideas.find((idea) => idea.id === activeId)?.id || ideas[0]?.id;
          saveIdeas();
          render();
          setSyncStatus("Sincronizado");
        } catch {
          setSyncStatus("Sin conexion · guardado local", true);
        }
      }, 5000);

      render();
      void startSync();
    </script>
  </body>
</html>
