<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manolisimo</title>
    <meta
      name="description"
      content="Archivo vivo de ideas absurdas para convertir ocurrencias en ilustraciones y productos."
    />
    <style>
      :root {
        --background: #f7f4ee;
        --foreground: #20201c;
        --ink: #20201c;
        --paper: #fffdf8;
        --paper-strong: #fff8e7;
        --line: #ded5c5;
        --muted: #776f63;
        --green: #2f6d5a;
        --red: #b54842;
        --yellow: #f0b64a;
        --blue: #456a9b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background:
          linear-gradient(90deg, rgba(32, 32, 28, 0.035) 1px, transparent 1px),
          linear-gradient(rgba(32, 32, 28, 0.035) 1px, transparent 1px),
          var(--background);
        background-size: 28px 28px;
        color: var(--foreground);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button,
      input,
      textarea,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app-shell {
        margin: 0 auto;
        max-width: 1220px;
        min-height: 100vh;
        padding: 28px;
      }

      .topbar {
        align-items: center;
        display: flex;
        gap: 20px;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .eyebrow {
        color: var(--green);
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0;
        margin: 0 0 7px;
        text-transform: uppercase;
      }

      h1,
      h2 {
        letter-spacing: 0;
        line-height: 1;
        margin: 0;
      }

      h1 {
        font-size: clamp(2.6rem, 7vw, 6.5rem);
        font-weight: 950;
      }

      h2 {
        font-size: clamp(1.45rem, 3vw, 2.35rem);
        font-weight: 900;
      }

      .counter {
        align-items: center;
        aspect-ratio: 1;
        background: var(--ink);
        border: 2px solid var(--ink);
        color: #fffaf0;
        display: grid;
        flex: 0 0 88px;
        justify-items: center;
        padding: 14px;
        text-align: center;
      }

      .counter strong {
        font-size: 2rem;
        line-height: 0.9;
      }

      .counter span {
        color: #e8dfce;
        font-size: 0.8rem;
      }

      .capture-panel {
        background: var(--paper);
        border: 2px solid var(--ink);
        box-shadow: 7px 7px 0 var(--ink);
        display: grid;
        gap: 18px;
        grid-template-columns:
          minmax(180px, 0.75fr) minmax(280px, 1.7fr)
          minmax(230px, 0.8fr);
        margin-bottom: 26px;
        padding: 20px;
      }

      textarea {
        background: #fffaf0;
        border: 2px solid var(--line);
        color: var(--ink);
        min-height: 118px;
        padding: 14px;
        resize: vertical;
        width: 100%;
      }

      textarea:focus,
      input:focus,
      select:focus,
      button:focus-visible {
        outline: 3px solid rgba(69, 106, 155, 0.35);
        outline-offset: 2px;
      }

      .capture-actions {
        display: grid;
        gap: 12px;
      }

      label {
        color: var(--muted);
        display: grid;
        font-size: 0.82rem;
        font-weight: 800;
        gap: 7px;
        text-transform: uppercase;
      }

      input,
      select {
        background: #fffaf0;
        border: 2px solid var(--line);
        color: var(--ink);
        min-height: 44px;
        padding: 0 12px;
      }

      .capture-actions button,
      .secondary-action {
        align-self: end;
        background: var(--red);
        border: 2px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        color: white;
        font-weight: 900;
        min-height: 48px;
        padding: 0 16px;
      }

      .secondary-action {
        background: var(--blue);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }

      .status-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
      }

      .status-tabs button {
        background: rgba(255, 253, 248, 0.78);
        border: 2px solid var(--line);
        color: var(--muted);
        font-weight: 850;
        min-height: 42px;
        padding: 0 14px;
      }

      .status-tabs button.active {
        background: var(--yellow);
        border-color: var(--ink);
        color: var(--ink);
      }

      .workspace {
        align-items: start;
        display: grid;
        gap: 22px;
        grid-template-columns: minmax(270px, 0.86fr) minmax(0, 1.5fr);
      }

      .idea-list {
        display: grid;
        gap: 12px;
      }

      .idea-row {
        align-items: center;
        background: rgba(255, 253, 248, 0.82);
        border: 2px solid var(--line);
        color: var(--ink);
        display: flex;
        gap: 14px;
        justify-content: space-between;
        min-height: 84px;
        padding: 14px;
        text-align: left;
        width: 100%;
      }

      .idea-row.selected {
        background: var(--paper-strong);
        border-color: var(--ink);
        box-shadow: 5px 5px 0 var(--ink);
      }

      .idea-row span {
        display: grid;
        gap: 5px;
        min-width: 0;
      }

      .idea-row strong {
        font-size: 1.02rem;
        line-height: 1.1;
      }

      .idea-row small {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .idea-row em {
        color: var(--blue);
        flex: 0 0 auto;
        font-size: 0.78rem;
        font-style: normal;
        font-weight: 900;
      }

      .idea-card,
      .empty-state {
        background: var(--paper);
        border: 2px solid var(--ink);
        box-shadow: 7px 7px 0 var(--ink);
        min-height: 560px;
        padding: clamp(18px, 3vw, 30px);
      }

      .idea-card-header {
        align-items: start;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 24px;
      }

      .idea-card-header select {
        min-width: 148px;
      }

      .idea-fields {
        display: grid;
        gap: 14px;
        margin: 0;
      }

      .idea-fields div {
        border-top: 2px solid var(--line);
        display: grid;
        gap: 8px;
        padding-top: 14px;
      }

      dt {
        color: var(--green);
        font-size: 0.78rem;
        font-weight: 900;
        text-transform: uppercase;
      }

      dd {
        font-size: 1rem;
        line-height: 1.45;
        margin: 0;
      }

      .product-text {
        background: var(--ink);
        color: #fffaf0;
        display: inline-block;
        font-size: clamp(1.45rem, 4vw, 2.8rem);
        font-weight: 950;
        justify-self: start;
        line-height: 1;
        padding: 12px 14px;
      }

      .idea-footer {
        border-top: 2px solid var(--ink);
        color: var(--muted);
        display: flex;
        font-size: 0.9rem;
        font-weight: 800;
        justify-content: space-between;
        margin-top: 24px;
        padding-top: 14px;
      }

      .empty-state {
        display: grid;
        place-content: center;
        text-align: center;
      }

      .empty-state p {
        color: var(--muted);
      }

      .github-note {
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.45;
        margin-top: 22px;
      }

      @media (max-width: 860px) {
        .app-shell {
          padding: 18px;
        }

        .capture-panel,
        .workspace {
          grid-template-columns: 1fr;
        }

        .topbar {
          align-items: end;
        }

        .counter {
          flex-basis: 72px;
        }
      }

      @media (max-width: 560px) {
        .topbar,
        .idea-card-header,
        .idea-footer {
          align-items: stretch;
          flex-direction: column;
        }

        .counter {
          align-items: center;
          aspect-ratio: auto;
          display: flex;
          flex-basis: auto;
          gap: 8px;
          justify-content: center;
          min-height: 52px;
          width: 100%;
        }

        .idea-row {
          align-items: start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar" aria-label="Cabecera Manolisimo">
        <div>
          <p class="eyebrow">Archivo vivo de tonterias ilustrables</p>
          <h1>Manolisimo</h1>
        </div>
        <div class="counter" aria-label="Ideas guardadas">
          <strong id="idea-count">0</strong>
          <span>ideas</span>
        </div>
      </header>

      <section class="capture-panel" aria-labelledby="new-idea-title">
        <div>
          <p class="eyebrow">Entrada rapida</p>
          <h2 id="new-idea-title">Nueva gilipollez</h2>
        </div>
        <textarea
          id="raw-idea"
          aria-label="Escribe una idea en bruto"
          placeholder="Ej: un notario que certifica si una croqueta esta demasiado caliente..."
        ></textarea>
        <div class="capture-actions">
          <label>
            Culpable
            <input id="author" value="Packo" aria-label="Autor de la idea" />
          </label>
          <button id="add-idea" type="button">Ordenar idea</button>
        </div>
      </section>

      <nav class="status-tabs" aria-label="Filtrar ideas por estado" id="filters"></nav>

      <section class="workspace">
        <div class="idea-list" aria-label="Lista de ideas" id="idea-list"></div>
        <article id="idea-detail"></article>
      </section>
    </main>

    <script>
      const statuses = ["Pendiente", "Favorita", "Dibujando", "Hecha"];
      const filters = ["Todas", ...statuses];
      const storageKey = "manolisimo-ideas";

      const examples = [
        {
          id: 1,
          title: "San USB Bendito",
          raw: "Un santo patron de los cargadores rotos.",
          summary:
            "Un santo cotidiano que protege cables que solo cargan si los colocas en un angulo imposible.",
          why:
            "Mezcla epica religiosa con una miseria tecnologica universal y ridicula.",
          illustration:
            "Un santo con halo, tunica y un cable pelado entre las manos, bendiciendo un movil al 2%.",
          productText: "Reza para que cargue",
          category: "Tecnologia cotidiana",
          status: "Favorita",
          author: "Packo",
          createdAt: "2026-08-28",
        },
        {
          id: 2,
          title: "Pulpo Autonomo",
          raw: "Un pulpo autonomo que factura en tinta.",
          summary:
            "Un pulpo freelance agotado que usa su propia tinta para emitir facturas, presupuestos y quejas.",
          why:
            "Convierte la vida laboral en una imagen literal absurda y muy dibujable.",
          illustration:
            "Pulpo con ocho brazos en una mesa, portatil, cafe, impresora y papeles manchados de tinta.",
          productText: "Facturo en tinta",
          category: "Trabajo absurdo",
          status: "Pendiente",
          author: "Manolo",
          createdAt: "2026-08-28",
        },
        {
          id: 3,
          title: "Gazpacho Con Manual",
          raw: "Un señor enfadado porque el gazpacho no tiene instrucciones.",
          summary:
            "Alguien intenta montar un gazpacho como si fuese un mueble complicado.",
          why:
            "La gracia esta en tratar una comida liquida como un objeto tecnico imposible.",
          illustration:
            "Mesa con tomates, pepino, una llave Allen, un vaso confundido y un manual abierto.",
          productText: "Agitar antes de tener una crisis",
          category: "Comida dramatica",
          status: "Dibujando",
          author: "Los dos",
          createdAt: "2026-08-28",
        },
      ];

      let ideas = readIdeas();
      let activeStatus = "Todas";
      let activeId = ideas[0]?.id;

      function readIdeas() {
        const saved = window.localStorage.getItem(storageKey);
        return saved ? JSON.parse(saved) : examples;
      }

      function saveIdeas() {
        window.localStorage.setItem(storageKey, JSON.stringify(ideas));
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function titleCase(value) {
        return value
          .trim()
          .replace(/[¿?¡!.,;:]+$/g, "")
          .split(/\s+/)
          .slice(0, 4)
          .map((word) => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
          .join(" ");
      }

      function pickCategory(text) {
        const lower = text.toLowerCase();

        if (/cable|movil|usb|ordenador|wifi|app|email|correo/.test(lower)) {
          return "Tecnologia cotidiana";
        }

        if (/gazpacho|taza|cafe|pan|tomate|croqueta|bocata|comida/.test(lower)) {
          return "Comida dramatica";
        }

        if (/factura|oficina|jefe|reunion|excel|autonomo/.test(lower)) {
          return "Trabajo absurdo";
        }

        if (/señor|senor|vecino|cuñado|cunado/.test(lower)) {
          return "Señores raros";
        }

        const categoryHints = [
          "Tecnologia cotidiana",
          "Comida dramatica",
          "Trabajo absurdo",
          "Criaturas administrativas",
          "Señores raros",
          "Objetos con ansiedad",
        ];

        return categoryHints[Math.floor(Math.random() * categoryHints.length)];
      }

      function makeIdea(raw, author) {
        const trimmed = raw.trim();
        const category = pickCategory(trimmed);
        const title = titleCase(trimmed) || "Idea Sin Nombre";
        const subject = trimmed.replace(/[.]+$/g, "");

        return {
          id: Date.now(),
          title,
          raw: trimmed,
          summary: `La idea gira alrededor de ${subject}, llevada a una escena clara y facil de recordar.`,
          why:
            "Funciona porque convierte una tonteria dicha en voz alta en una imagen concreta, exagerada y reconocible.",
          illustration: `Manolo podria dibujar ${subject.toLowerCase()} como si fuese algo totalmente serio, con detalles cotidianos que hagan mas absurdo el contraste.`,
          productText: title.length < 20 ? title : "Esto era necesario",
          category,
          status: "Pendiente",
          author: author.trim() || "Sin culpable",
          createdAt: new Date().toISOString().slice(0, 10),
        };
      }

      function renderFilters() {
        const filtersNode = document.querySelector("#filters");
        filtersNode.innerHTML = filters
          .map(
            (filter) =>
              `<button class="${activeStatus === filter ? "active" : ""}" type="button" data-filter="${filter}">${filter}</button>`,
          )
          .join("");

        filtersNode.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => {
            activeStatus = button.dataset.filter;
            render();
          });
        });
      }

      function renderList() {
        const visible =
          activeStatus === "Todas"
            ? ideas
            : ideas.filter((idea) => idea.status === activeStatus);
        const listNode = document.querySelector("#idea-list");

        if (!visible.length) {
          listNode.innerHTML = "";
          return;
        }

        listNode.innerHTML = visible
          .map(
            (idea) => `
              <button class="idea-row ${activeId === idea.id ? "selected" : ""}" type="button" data-id="${idea.id}">
                <span>
                  <strong>${escapeHtml(idea.title)}</strong>
                  <small>${escapeHtml(idea.category)}</small>
                </span>
                <em>${escapeHtml(idea.status)}</em>
              </button>
            `,
          )
          .join("");

        listNode.querySelectorAll("button").forEach((button) => {
          button.addEventListener("click", () => {
            activeId = Number(button.dataset.id);
            render();
          });
        });
      }

      function renderDetail() {
        const detailNode = document.querySelector("#idea-detail");
        const visible =
          activeStatus === "Todas"
            ? ideas
            : ideas.filter((idea) => idea.status === activeStatus);
        const activeIdea = ideas.find((idea) => idea.id === activeId) || visible[0];

        if (!activeIdea) {
          detailNode.className = "empty-state";
          detailNode.innerHTML = `
            <h2>No hay ideas en este filtro</h2>
            <p>Cambia de estado o añade una nueva desde la entrada rapida.</p>
          `;
          return;
        }

        activeId = activeIdea.id;
        detailNode.className = "idea-card";
        detailNode.innerHTML = `
          <div class="idea-card-header">
            <div>
              <p class="eyebrow">${escapeHtml(activeIdea.category)}</p>
              <h2>${escapeHtml(activeIdea.title)}</h2>
            </div>
            <select aria-label="Cambiar estado" id="status-select">
              ${statuses
                .map(
                  (status) =>
                    `<option ${activeIdea.status === status ? "selected" : ""}>${status}</option>`,
                )
                .join("")}
            </select>
          </div>

          <dl class="idea-fields">
            <div>
              <dt>Frase original</dt>
              <dd>${escapeHtml(activeIdea.raw)}</dd>
            </div>
            <div>
              <dt>Version ordenada</dt>
              <dd>${escapeHtml(activeIdea.summary)}</dd>
            </div>
            <div>
              <dt>Por que hace gracia</dt>
              <dd>${escapeHtml(activeIdea.why)}</dd>
            </div>
            <div>
              <dt>Posible ilustracion</dt>
              <dd>${escapeHtml(activeIdea.illustration)}</dd>
            </div>
            <div>
              <dt>Texto para producto</dt>
              <dd class="product-text">${escapeHtml(activeIdea.productText)}</dd>
            </div>
          </dl>

          <p class="github-note">
            Esta version funciona directamente desde GitHub Pages y guarda los datos en este navegador.
          </p>

          <footer class="idea-footer">
            <span>${escapeHtml(activeIdea.author)}</span>
            <span>${escapeHtml(activeIdea.createdAt)}</span>
          </footer>
        `;

        document.querySelector("#status-select").addEventListener("change", (event) => {
          activeIdea.status = event.target.value;
          saveIdeas();
          render();
        });
      }

      function render() {
        document.querySelector("#idea-count").textContent = ideas.length;
        renderFilters();
        renderList();
        renderDetail();
      }

      document.querySelector("#add-idea").addEventListener("click", () => {
        const rawIdeaNode = document.querySelector("#raw-idea");
        const authorNode = document.querySelector("#author");

        if (!rawIdeaNode.value.trim()) {
          rawIdeaNode.focus();
          return;
        }

        const idea = makeIdea(rawIdeaNode.value, authorNode.value);
        ideas = [idea, ...ideas];
        activeId = idea.id;
        activeStatus = "Todas";
        rawIdeaNode.value = "";
        saveIdeas();
        render();
      });

      render();
    </script>
  </body>
</html>
